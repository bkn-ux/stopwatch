<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실버 스탑워치</title>
<style>
  :root { --bg:#e4e7ec; --face:#f3f5f8; --text:#20242b; --muted:#6b7280; --accent:#3b5bdb; --stop:#d6336c; --line:#d2d6dd;
    --sh1:rgba(255,255,255,.9); --sh2:rgba(120,130,150,.35); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#2a2d33; --face:#34383f; --text:#eceef2; --muted:#9aa1ad; --line:#454a53; --sh1:rgba(255,255,255,.05); --sh2:rgba(0,0,0,.5); }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Malgun Gothic",sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; }
  main { width:100%; max-width:420px; background:linear-gradient(145deg,var(--face),var(--bg)); border-radius:28px; padding:28px 22px;
    box-shadow:12px 12px 28px var(--sh2),-10px -10px 24px var(--sh1); }
  .dial { position:relative; width:min(72vw,260px); aspect-ratio:1; margin:0 auto 22px; }
  .dial svg { width:100%; height:100%; transform:rotate(-90deg); }
  .track { fill:none; stroke:var(--line); stroke-width:6; }
  .prog { fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round; transition:stroke .2s; }
  .readout { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .time { font-size:clamp(30px,9vw,40px); font-weight:300; font-variant-numeric:tabular-nums; }
  .time small { font-size:.55em; color:var(--muted); }
  .state { font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:.1em; }
  .btns { display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:12px; margin-bottom:18px; }
  button { min-height:52px; font-size:16px; border:0; border-radius:16px; cursor:pointer; font-family:inherit;
    background:var(--face); color:var(--text); box-shadow:4px 4px 10px var(--sh2),-3px -3px 8px var(--sh1);
    transition:transform .1s, box-shadow .1s; }
  button:active:not(:disabled) { transform:scale(.97); box-shadow:inset 3px 3px 7px var(--sh2),inset -3px -3px 7px var(--sh1); }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #start { background:var(--accent); color:#fff; font-weight:600; }
  #start.running { background:var(--stop); }
  kbd { font-size:11px; opacity:.7; border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-left:6px; }
  ol { list-style:none; margin:0; padding:0; max-height:200px; overflow-y:auto; }
  li { display:grid; grid-template-columns:2.2em 1fr 1fr; padding:10px 6px; border-top:1px solid var(--line);
    font-variant-numeric:tabular-nums; font-size:14px; }
  li span:first-child { color:var(--muted); } li span:nth-child(n+2){ text-align:right; }
  li.best span:nth-child(2){ color:#2b9348; font-weight:600; } li.worst span:nth-child(2){ color:var(--stop); font-weight:600; }
  .empty { text-align:center; color:var(--muted); font-size:13px; padding:8px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<main>
  <div class="dial">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="46"/>
      <circle class="prog" id="prog" cx="50" cy="50" r="46"/>
    </svg>
    <div class="readout">
      <div class="time" id="display" role="timer" aria-live="off">00:00<small>.00</small></div>
      <div class="state" id="state">준비</div>
    </div>
  </div>
  <div class="btns">
    <button id="lap" disabled aria-keyshortcuts="L">랩<kbd>L</kbd></button>
    <button id="start" aria-keyshortcuts="Space">시작<kbd>Space</kbd></button>
    <button id="reset" disabled aria-keyshortcuts="R">초기화<kbd>R</kbd></button>
  </div>
  <ol id="laps" aria-label="랩 기록"></ol>
  <div class="empty" id="empty">달리는 중 ‘랩’을 눌러 구간을 기록하세요</div>
</main>
<script>
  const $=id=>document.getElementById(id);
  const display=$('display'),prog=$('prog'),state=$('state'),startBtn=$('start'),lapBtn=$('lap'),resetBtn=$('reset'),lapsEl=$('laps'),empty=$('empty');
  const C=2*Math.PI*46; prog.style.strokeDasharray=C;
  const KEY='stopwatch-silver';
  let s={running:false,base:0,since:0,laps:[]},raf=null;
  try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.laps))s=v}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
  const pad=(n,l=2)=>String(n).padStart(l,'0');
  const txt=ms=>{const h=Math.floor(ms/3600000);return (h?pad(h)+':':'')+`${pad(Math.floor(ms/60000)%60)}:${pad(Math.floor(ms/1000)%60)}.${pad(Math.floor(ms/10)%100)}`};
  const now=()=>s.base+(s.running?Date.now()-s.since:0);
  function tick(){
    const t=now();
    display.innerHTML=txt(t).replace(/\.(\d\d)$/,'<small>.$1</small>');
    prog.style.strokeDashoffset=C*(1-((t%60000)/60000));   // 1분에 한 바퀴
    document.title=(s.running?'▶ ':'')+txt(t).split('.')[0];
    if(s.running)raf=requestAnimationFrame(tick);
  }
  function drawLaps(){
    const sp=s.laps.map((t,i)=>t-(s.laps[i-1]||0));
    const min=Math.min(...sp),max=Math.max(...sp);
    lapsEl.innerHTML=s.laps.map((t,i)=>{
      const c=s.laps.length>2?(sp[i]===min?'best':sp[i]===max?'worst':''):'';
      return `<li class="${c}"><span>${i+1}</span><span>${txt(sp[i])}</span><span>${txt(t)}</span></li>`}).reverse().join('');
    empty.style.display=s.laps.length?'none':'block';
  }
  function ui(){
    startBtn.firstChild.textContent=s.running?'정지':(now()>0?'계속':'시작');
    startBtn.classList.toggle('running',s.running);
    state.textContent=s.running?'측정 중':(now()>0?'일시정지':'준비');
    lapBtn.disabled=!s.running; resetBtn.disabled=s.running||now()===0;
    cancelAnimationFrame(raf);tick();drawLaps();save();
  }
  function toggle(){ if(s.running){s.base=now();s.running=false}else{s.since=Date.now();s.running=true} ui(); }
  function lap(){ if(s.running){s.laps.push(now());ui()} }
  function reset(){ if(!s.running){s={running:false,base:0,since:0,laps:[]};ui()} }
  startBtn.onclick=toggle;lapBtn.onclick=lap;resetBtn.onclick=reset;
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='BUTTON'&&e.code==='Space')return; // 버튼 포커스 시 기본 동작 유지
    if(e.code==='Space'){e.preventDefault();toggle()}
    else if(e.key.toLowerCase()==='l')lap(); else if(e.key.toLowerCase()==='r')reset();
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)ui()});
  ui();
</script>
</body>
</html>
